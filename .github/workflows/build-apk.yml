
name: INFINIT X - Criar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  construir:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Criar projeto
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/infinitx/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          HTML=$(find . -maxdepth 2 -type f -iname "*.html" ! -path "./.github/*" | head -n 1)
          if [ -z "$HTML" ]; then
            echo "ERRO: arquivo HTML não encontrado na raiz."
            exit 1
          fi
          cp "$HTML" app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "INFINIT-X"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.infinitx.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.infinitx.app'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:colorAccent">#A855F7</item>
                  <item name="android:statusBarColor">#080610</item>
                  <item name="android:navigationBarColor">#080610</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <application android:theme="@style/AppTheme" android:label="INFINIT X">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".FloatingService" android:exported="false"/>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/infinitx/app/MainActivity.kt <<'EOF'
          package com.infinitx.app

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val web = WebView(this)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.webViewClient = WebViewClient()
                  web.loadUrl("file:///android_asset/index.html")
                  setContentView(web)

                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "Ative Exibir sobre outros apps.", Toast.LENGTH_LONG).show()
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                  }
              }

              override fun onResume() {
                  super.onResume()
                  if (Settings.canDrawOverlays(this)) {
                      startService(Intent(this, FloatingService::class.java))
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/infinitx/app/FloatingService.kt <<'EOF'
          package com.infinitx.app

          import android.app.Service
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.IBinder
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager
          import android.widget.LinearLayout
          import android.widget.TextView

          class FloatingService : Service() {
              private lateinit var wm: WindowManager
              private var bubble: TextView? = null
              private var panel: LinearLayout? = null
              private var lastTap = 0L

              override fun onCreate() {
                  super.onCreate()
                  startNotification()
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  showBubble()
              }

              private fun startNotification() {
                  val manager = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= 26) {
                      manager.createNotificationChannel(NotificationChannel("infinitx", "INFINIT X", NotificationManager.IMPORTANCE_LOW))
                  }
                  val notification = if (Build.VERSION.SDK_INT >= 26) {
                      Notification.Builder(this, "infinitx")
                          .setContentTitle("INFINIT X")
                          .setContentText("Bolha flutuante ativa")
                          .setSmallIcon(android.R.drawable.ic_dialog_info).build()
                  } else {
                      @Suppress("DEPRECATION")
                      Notification.Builder(this)
                          .setContentTitle("INFINIT X")
                          .setContentText("Bolha flutuante ativa")
                          .setSmallIcon(android.R.drawable.ic_dialog_info).build()
                  }
                  startForeground(1, notification)
              }

              private fun bg(color: Int, radius: Float) = GradientDrawable().apply {
                  setColor(color)
                  cornerRadius = radius
                  setStroke(2, Color.rgb(168, 85, 247))
              }

              private fun params(width: Int, height: Int) = WindowManager.LayoutParams(
                  width, height,
                  WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                  PixelFormat.TRANSLUCENT
              ).apply { gravity = Gravity.TOP or Gravity.START }

              private fun showBubble() {
                  if (bubble != null) return

                  val view = TextView(this).apply {
                      text = "X"
                      textSize = 21f
                      setTextColor(Color.WHITE)
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                      background = bg(Color.rgb(91, 33, 182), 100f)
                  }

                  val p = params(58, 58).apply {
                      x = 20
                      y = 250
                  }

                  var downX = 0f
                  var downY = 0f
                  var initialX = 0
                  var initialY = 0
                  var moved = false

                  view.setOnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              downX = event.rawX
                              downY = event.rawY
                              initialX = p.x
                              initialY = p.y
                              moved = false
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = event.rawX - downX
                              val dy = event.rawY - downY
                              if (kotlin.math.abs(dx) > 8 || kotlin.math.abs(dy) > 8) moved = true
                              p.x = initialX + dx.toInt()
                              p.y = initialY + dy.toInt()
                              wm.updateViewLayout(view, p)
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!moved) {
                                  val now = System.currentTimeMillis()
                                  if (now - lastTap < 350) hideBubble() else showPanel()
                                  lastTap = now
                              }
                              true
                          }
                          else -> true
                      }
                  }

                  bubble = view
                  wm.addView(view, p)
              }

              private fun showPanel() {
                  if (panel != null) {
                      hidePanel()
                      return
                  }

                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(18, 16, 18, 16)
                      background = bg(Color.rgb(12, 8, 24), 28f)
                  }

                  val title = TextView(this).apply {
                      text = "INFINIT X"
                      textSize = 20f
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.rgb(192, 132, 252))
                      gravity = Gravity.CENTER
                      setPadding(4, 8, 4, 14)
                  }
                  box.addView(title)

                  val close = TextView(this).apply {
                      text = "✕ FECHAR"
                      gravity = Gravity.CENTER
                      setTextColor(Color.WHITE)
                      setPadding(12, 12, 12, 12)
                      background = bg(Color.rgb(75, 25, 120), 18f)
                      setOnClickListener { hidePanel() }
                  }
                  box.addView(close)

                  listOf("FPS AUTO", "OTIMIZAÇÃO DE JOGO", "OTIMIZAÇÃO DE FPS").forEach { option ->
                      val item = TextView(this).apply {
                          text = option
                          textSize = 14f
                          gravity = Gravity.CENTER
                          setTextColor(Color.WHITE)
                          setPadding(12, 16, 12, 16)
                          background = bg(Color.rgb(35, 20, 55), 18f)
                      }
                      val lp = LinearLayout.LayoutParams(-1, -2)
                      lp.topMargin = 10
                      box.addView(item, lp)
                  }

                  val p = params(260, WindowManager.LayoutParams.WRAP_CONTENT).apply {
                      x = 85
                      y = 250
                  }
                  panel = box
                  wm.addView(box, p)
              }

              private fun hidePanel() {
                  panel?.let { wm.removeView(it) }
                  panel = null
              }

              private fun hideBubble() {
                  hidePanel()
                  bubble?.let { wm.removeView(it) }
                  bubble = null
                  stopSelf()
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  showBubble()
                  return START_STICKY
              }

              override fun onDestroy() {
                  hidePanel()
                  bubble?.let { wm.removeView(it) }
                  bubble = null
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: INFINIT-X-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
